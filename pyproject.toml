[project]
name = "shopease-recommendation-engine"
version = "0.1.0"
description = "Recommendation and demand forecasting pipeline for an e-commerce retail workflow"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.11.0",
  "scikit-learn>=1.4.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "pyarrow>=15.0.0",
  "joblib>=1.4.0",
  "jupyter>=1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
